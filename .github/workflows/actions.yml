name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run_cpu_tests:
    strategy:
      matrix:
        include:
          # The linux runner runs out of memory partway through the suite.
          # Splitting it across worker processes means a worker that dies no
          # longer takes the whole run with it, but -n auto gives 4 workers on
          # a 4 vCPU runner and their combined peak still reaches about 8.4G
          # against 16G of RAM, so the run stayed flaky. Two workers hold the
          # same suite in about 6.4G. The growth is not ours, the numpy
          # backend retains the same memory on the same files, most of it in
          # ops/numpy_test.py, so there is nothing to fix in the backend.
          # loadfile groups the tests by file, which is how keras runs them.
          # Do not swap it for load, which lowers the per worker peak but
          # raises the combined one to 12.3G.
          - os: ubuntu-latest
            pytest_args: -n 2 --dist loadfile
          - os: macos-latest
            pytest_args: ""
      fail-fast: false

    name: Run tests on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120

    env:
      KERAS_HOME: ../keras-mlx/.github/workflows/config
      # mlx JIT-compiles CPU kernels via g++, and as of 0.31.2 its generated
      # code redeclares the _Float128/_Float64 builtins, which gcc 13+ rejects.
      # Disable the JIT until the wheel ships compatible codegen.
      MLX_DISABLE_COMPILE: 1

    steps:
      - name: Set up Python
        if: ${{ matrix.os == 'macos-latest' }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Checkout keras-mlx ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: keras-mlx
          persist-credentials: false
 
      - name: Checkout keras
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keras-team/keras
          ref: pluggable_backend
          path: keras
          persist-credentials: false
 
      - name: Install Python dependencies
        run: |
          pip install -r keras/requirements-common.txt
          pip install -r keras-mlx/requirements.txt

      - name: Install keras-mlx
        working-directory: ./keras-mlx
        run: pip install -e .

      - name: Verify installation
        working-directory: ./keras
        run: python -c "import keras; assert keras.backend.backend() == 'mlx'; import keras_mlx; print(keras_mlx.__version__)"

      - name: Run Tests
        working-directory: ./keras
        run: pytest keras ${{ matrix.pytest_args }} --ignore keras/src/applications --ignore keras/src/wrappers

      # TODO integration tests

  format:
    name: Check the code format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keras-mlx ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Check the code format
        run: |
          ruff check .
          ruff format --check .
