name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  release:
    types: [created]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  run_linux_tests:
    # ubuntu-latest is 4 vCPU and 16G, and the suite does not fit in it. It
    # grows to about 5.5G in a single process and dies roughly one run in
    # four. That is not backend specific, ops/numpy_test.py retains about
    # 3.7G under numpy too. keras runs the same suite on linux-x86-n2-16, so
    # run it there. Those runners need a container, so follow the keras setup.
    name: Run tests on linux
    runs-on: linux-x86-n2-16
    container:
      image: python:3.11-slim
    timeout-minutes: 120

    env:
      KERAS_HOME: ../keras-mlx/.github/workflows/config
      # mlx JIT-compiles CPU kernels via g++, and as of 0.31.2 its generated
      # code redeclares the _Float128/_Float64 builtins, which gcc 13+ rejects.
      # Disable the JIT until the wheel ships compatible codegen.
      MLX_DISABLE_COMPILE: 1

    steps:
      - name: Install binary dependencies
        # python:3.11-slim ships neither of these. build-essential is the
        # C++ compiler Torch Dynamo needs, and git is for the two checkouts
        # below. Those end up owned by a different user than the container
        # runs as, so git has to be told they are safe.
        run: |
          apt-get update
          apt-get -y install build-essential git
          git config --global --add safe.directory '*'

      - name: Checkout keras-mlx ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: keras-mlx
          persist-credentials: false

      - name: Checkout keras
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keras-team/keras
          ref: pluggable_backend
          path: keras
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          pip install -r keras/requirements-common.txt
          pip install -r keras-mlx/requirements.txt

      - name: Install keras-mlx
        working-directory: ./keras-mlx
        run: pip install -e .

      - name: Verify installation
        working-directory: ./keras
        run: python -c "import keras; assert keras.backend.backend() == 'mlx'; import keras_mlx; print(keras_mlx.__version__)"

      - name: Run the keras-mlx tests
        # These cover the behaviour the keras suite skips for this backend.
        # They are quick, so run them before the long suite below.
        working-directory: ./keras
        env:
          # tensorflow pulls a keras from PyPI that has no mlx backend, and
          # pytest does not put the working directory on the path the way
          # `python -c` does, so point at the checkout explicitly.
          PYTHONPATH: ${{ github.workspace }}/keras
        run: pytest ../keras-mlx/keras_mlx

      - name: Run Tests
        working-directory: ./keras
        # Splitting across workers keeps each process small and means a worker
        # that dies no longer takes the whole run with it. loadfile groups the
        # tests by file, which is how keras itself runs them.
        run: pytest keras -n auto --dist loadfile --ignore keras/src/applications --ignore keras/src/wrappers

      # TODO integration tests

  run_macos_tests:
    # macos-latest is Apple silicon, so this is the only leg that runs Metal.
    # It has no container, GitHub hosted macOS runners cannot run one.
    name: Run tests on macos
    runs-on: macos-latest
    timeout-minutes: 120

    env:
      KERAS_HOME: ../keras-mlx/.github/workflows/config
      # See the linux job.
      MLX_DISABLE_COMPILE: 1

    steps:
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Checkout keras-mlx ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          path: keras-mlx
          persist-credentials: false

      - name: Checkout keras
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          repository: keras-team/keras
          ref: pluggable_backend
          path: keras
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          pip install -r keras/requirements-common.txt
          pip install -r keras-mlx/requirements.txt

      - name: Install keras-mlx
        working-directory: ./keras-mlx
        run: pip install -e .

      - name: Verify installation
        working-directory: ./keras
        run: python -c "import keras; assert keras.backend.backend() == 'mlx'; import keras_mlx; print(keras_mlx.__version__)"

      - name: Run the keras-mlx tests
        # These cover the behaviour the keras suite skips for this backend.
        # They are quick, so run them before the long suite below.
        working-directory: ./keras
        env:
          # tensorflow pulls a keras from PyPI that has no mlx backend, and
          # pytest does not put the working directory on the path the way
          # `python -c` does, so point at the checkout explicitly.
          PYTHONPATH: ${{ github.workspace }}/keras
        run: pytest ../keras-mlx/keras_mlx

      - name: Run Tests
        working-directory: ./keras
        run: pytest keras --ignore keras/src/applications --ignore keras/src/wrappers

      # TODO integration tests

  format:
    name: Check the code format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout keras-mlx ${{ github.ref }}
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Check the code format
        run: |
          ruff check .
          ruff format --check .
