[build-system]
requires = ["setuptools >=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keras-mlx"
authors = [
    {name = "MLX Developers", email = "mlx@group.apple.com"},
]
description = "MLX backend for Keras"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache License 2.0"}
dynamic = ["version"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3 :: Only",
    "Operating System :: Unix",
    "Operating System :: MacOS",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development",
]
dependencies = [
    "keras",
    "numpy",
    "mlx<0.32",
]

[project.urls]
Home = "https://opensource.apple.com/projects/mlx/"
Repository = "https://github.com/keras-team/keras-mlx/"

[tool.setuptools.dynamic]
version = {attr = "keras_mlx.src.version.__version__"}

[tool.setuptools.package-dir]
"" = "."

[tool.ruff]
line-length = 80
